<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App web con server & DB</title>
</head>
<body>
    <h1>Aplicación Web: Python + SQLite + HTML</h1>

    <!-- Formulario que envía datos al servidor mediante POST -->
    <form method="POST">
        <label>Nombre del producto</label>
        <input type="text" name="nombre" required><br>

        <label>Precio del producto</label>
        <input type="number" name="precio" required><br>

        <label>Cantidad del producto</label>
        <input type="number" name="cantidad" required><br>
        
        <button type="submit">guardar</button>
    </form>

    <h2>Elementos guardados anteriormente</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>PRECIO</th>
                <th>CANTIDAD</th>
                <th>ACCION</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in elementos %}
                <tr>
                    <td>{{ fila[0] }}</td>
                    <td>{{ fila[1] }}</td>
                    <td>{{ fila[2] }}</td>
                    <td>{{ fila[3] }}</td>
                    <td>
                        <!-- Formulario individual por cada producto para enviarlo a su ruta de eliminación -->
                        <form action="/editar/{{ fila[0] }}" method="GET">
                            <button type="submit">Editar</button>
                        </form>
                        <form action="/eliminar/{{ fila[0] }}" method="POST">
                            <button type="submit" onclick="return confirm('Estas seguro?');">Eliminar</button>
                        </form>
                        
                    </td>
                </tr>
            {% else %}
                <p>No hay registros</p>
            {% endfor%}
        </tbody>
    </table>
</body>
</html>
